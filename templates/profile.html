{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 mt-10 max-w-2xl">
  <div class="bg-white dark:bg-darkCard shadow-xl rounded-xl overflow-hidden">
    <div class="bg-indigo-600 px-6 py-4">
      <h3 class="text-2xl font-bold text-white mb-0"> Profile</h3>
    </div>
    <div class="p-8">
      <h5 class="text-xl mb-4 dark:text-gray-100">Username: <strong class="text-indigo-600 dark:text-indigo-400">{{
          username }}</strong></h5>
      <p class="text-lg text-gray-700 dark:text-gray-300 mb-2">Rooms Joined: <strong>{{ rooms_joined }}</strong></p>
      <p class="text-lg text-gray-700 dark:text-gray-300 mb-4">Total Streak Days: <strong>{{ total_streak_days
          }}</strong></p>
      <hr class="border-gray-200 dark:border-gray-700">

      {% if current_month_days %}
      <div class="mt-6">
        <h4 class="text-lg font-semibold mb-3 dark:text-gray-200">Active Days this Month:</h4>
        <div class="flex flex-wrap gap-2">
          {% for day in current_month_days %}
          <span class="px-2 py-1 bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 rounded text-sm">{{
            day }}</span>
          {% endfor %}
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}

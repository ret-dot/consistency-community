{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 mt-8 max-w-3xl">
    <div class="bg-white dark:bg-darkCard rounded-xl shadow-lg p-8 dark:border dark:border-gray-700">
        <h2 class="text-3xl font-bold mb-2 dark:text-gray-100">{{ post.title }}</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm mb-6 pb-4 border-b dark:border-gray-700">
            by <span class="font-medium text-gray-700 dark:text-gray-300">{{ post.author.username }}</span>
            on {{ post.timestamp.strftime('%Y-%m-%d %H:%M') }}
        </p>

        <div class="mb-8 prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200 leading-relaxed">
            {{ post.content | safe }}
        </div>

        <div class="mt-8 pt-6 border-t dark:border-gray-700">
            <a href="{{ url_for('blog_list') }}"
                class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition">←
                Back to Blog</a>
        </div>
    </div>
</div>
{% endblock %}

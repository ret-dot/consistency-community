{% extends "base.html" %}
{% block content %}
<h2>{{ post.title }}</h2>
<p class="text-muted">by {{ post.author.username }} on {{ post.timestamp.strftime('%Y-%m-%d %H:%M') }}</p>
<div class="mb-4">{{ post.content | safe }}</div>
<a href="{{ url_for('blog_list') }}" class="btn btn-secondary">Back to Blog</a>
{% endblock %}

<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <title>Consistency Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#4f46e5',
            accent: '#10b981',
            darkBot: '#1f2937',
            darkPage: '#111827',
            darkCard: '#1f2937',
            darkText: '#f3f4f6',
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth transition for theme switching */
    body,
    div,
    nav,
    footer {
      transition-property: background-color, border-color, color, fill, stroke;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 200ms;
    }
  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-12XRNT7SBV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-12XRNT7SBV');
  </script>

  <script>
    // Theme initialization
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }
  </script>
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-darkPage dark:text-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-white dark:bg-darkCard shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="{{ url_for('index') }}" class="text-xl font-bold text-primary dark:text-indigo-400">Consistency
        Calendar</a>
      <div class="flex items-center space-x-4 text-sm">
        <button onclick="toggleTheme()"
          class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
          🌓
        </button>
        {% if current_user.is_authenticated %}
        <span class="text-gray-600 dark:text-gray-300">👋 <strong>{{ current_user.username }}</strong></span>
        <a href="{{ url_for('profile') }}"
          class="text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-indigo-400">Profile</a>
        <a href="{{ url_for('explore_rooms') }}"
          class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">Explore</a>
        <a href="{{ url_for('drawing') }}"
          class="text-purple-600 dark:text-purple-400 hover:text-purple-800 dark:hover:text-purple-300">simple art</a>
        <a href="{{ url_for('friends_dashboard') }}"
          class="text-green-600 dark:text-green-400 hover:text-green-800 dark:hover:text-green-300">Friends</a>
        <a href="{{ url_for('friend_requests') }}"
          class="text-yellow-600 dark:text-yellow-400 hover:text-yellow-800 dark:hover:text-yellow-300">Requests</a>
        <a href="{{ url_for('blog_create') }}"
          class="text-yellow-600 dark:text-yellow-400 hover:text-yellow-800 dark:hover:text-yellow-300">Create diary</a>
        <a href="{{ url_for('blog_list') }}"
          class="text-yellow-600 dark:text-yellow-400 hover:text-yellow-800 dark:hover:text-yellow-300">Diary</a>
        <a href="{{ url_for('logout') }}"
          class="text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300">Logout </a>
        {% else %}
        <a href="{{ url_for('login') }}"
          class="text-primary hover:text-indigo-700 dark:text-indigo-400 dark:hover:text-indigo-300">Login</a>
        <a href="{{ url_for('register') }}"
          class="text-primary hover:text-indigo-700 dark:text-indigo-400 dark:hover:text-indigo-300">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer
    class="bg-white dark:bg-darkCard border-t dark:border-gray-700 py-4 text-center text-sm text-gray-500 dark:text-gray-400">
    &copy; {{ now.year }} Consistency Calendar. All rights reserved.
  </footer>

</body>

</html>

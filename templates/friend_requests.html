<!-- templates/friend_requests.html -->
{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 mt-8 max-w-2xl">
  <h2 class="text-2xl font-bold mb-4 dark:text-white">Friend Requests</h2>
  {% if requests %}
  <ul class="bg-white dark:bg-darkCard rounded-lg shadow overflow-hidden divide-y divide-gray-200 dark:divide-gray-700">
    {% for req in requests %}
    <li class="p-4 flex justify-between items-center dark:text-gray-200">
      <span class="font-medium">{{ req.sender.username }}</span>
      <div class="space-x-2">
        <a href="{{ url_for('accept_friend', request_id=req.id) }}"
          class="px-3 py-1 bg-green-500 hover:bg-green-600 text-white rounded text-sm transition">Accept</a>
        <a href="{{ url_for('reject_friend', request_id=req.id) }}"
          class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-sm transition">Reject</a>
      </div>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-gray-600 dark:text-gray-400">No pending friend requests.</p>
  {% endif %}
</div>
{% endblock %}

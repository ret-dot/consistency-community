{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 mt-8 max-w-2xl">
  <div class="bg-white dark:bg-darkCard rounded-xl shadow-lg p-8 dark:border dark:border-gray-700">
    <h2 class="text-3xl font-bold mb-6 dark:text-gray-100">New Daily Diary Post</h2>
    <form method="post" class="space-y-4">
      <div>
        <label for="title" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Title</label>
        <input type="text"
          class="w-full px-4 py-2 border dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
          name="title" required>
      </div>
      <div>
        <label for="content" class="block text-gray-700 dark:text-gray-300 font-medium mb-1">Content</label>
        <textarea
          class="w-full px-4 py-2 border dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
          name="content" rows="6" required></textarea>
      </div>
      <button type="submit"
        class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition shadow">Publish</button>
    </form>
  </div>
</div>
{% endblock %}

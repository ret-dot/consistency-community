{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 mt-8 max-w-3xl">
  <h2 class="text-2xl font-bold mb-4 dark:text-gray-100">Chat with {{ friend.username }}</h2>

  <div class="border dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-lg p-4 mb-4" id="chat-box"
    style="height: 400px; overflow-y: auto;">
    {% for msg in messages %}
    <div class="mb-3 dark:text-gray-200">
      <strong
        class="{{ 'text-blue-600 dark:text-blue-400' if msg.sender_id == current_user.id else 'text-green-600 dark:text-green-400' }}">
        {{ msg.sender_id == current_user.id and 'You' or friend.username }}
      </strong>:
      <span>{{ msg.content }}</span>
      <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">{{ msg.timestamp.strftime("%Y-%m-%d %H:%M") }}</div>
    </div>
    {% endfor %}
  </div>

  <form id="chat-form" autocomplete="off" class="flex gap-2">
    <input type="text" name="message" id="chat-input" placeholder="Type a message..." required
      class="flex-grow px-4 py-2 border dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500">
    <button type="submit"
      class="bg-primary hover:bg-indigo-700 text-white px-6 py-2 rounded-lg transition">Send</button>
  </form>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  var socket = io();
  var friend_id = Number("{{ friend.id }}");
  socket.emit('join_private', { friend_id: friend_id });

  document.getElementById('chat-form').onsubmit = function (e) {
    e.preventDefault();
    var msg = document.getElementById('chat-input').value;
    if (msg.trim() === "") return;
    socket.emit('send_private_message', { friend_id: friend_id, message: msg });
    document.getElementById('chat-input').value = '';
  };

  socket.on('receive_private_message', function (data) {
    var chatBox = document.getElementById('chat-box');
    var msgDiv = document.createElement('div');
    msgDiv.className = "mb-3 dark:text-gray-200";
    var isMe = data.username === '{{ current_user.username }}';


    var senderClass = isMe ? 'text-blue-600 dark:text-blue-400' : 'text-green-600 dark:text-green-400';
    var senderName = isMe ? 'You' : data.username;

    msgDiv.innerHTML = `<strong class="${senderClass}">${senderName}</strong>: <span>${data.message}</span> <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${data.timestamp}</div>`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  });
</script>
{% endblock %}

<!-- templates/private_chat.html -->
{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Chat with {{ friend.username }}</h2>

  <div class="border p-3 mb-3" id="chat-box" style="height: 400px; overflow-y: scroll; background: #f9f9f9;">
    {% for msg in messages %}
      <div class="mb-2">
        <strong>{{ msg.sender_id == current_user.id and 'You' or friend.username }}</strong>:
        <span>{{ msg.content }}</span>
        <div class="text-muted" style="font-size: 0.8em;">{{ msg.timestamp.strftime("%Y-%m-%d %H:%M") }}</div>
      </div>
    {% endfor %}
  </div>

  <form id="chat-form" autocomplete="off">
    <div class="input-group">
      <input type="text" name="message" class="form-control" id="chat-input" placeholder="Type a message..." required>
      <button type="submit" class="btn btn-primary">Send</button>
    </div>
  </form>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    var socket = io();
    var friend_id = {{ friend.id }};
    socket.emit('join_private', {friend_id: friend_id});

    document.getElementById('chat-form').onsubmit = function(e) {
        e.preventDefault();
        var msg = document.getElementById('chat-input').value;
        if(msg.trim() === "") return;
        socket.emit('send_private_message', {friend_id: friend_id, message: msg});
        document.getElementById('chat-input').value = '';
    };

    socket.on('receive_private_message', function(data) {
        var chatBox = document.getElementById('chat-box');
        var msgDiv = document.createElement('div');
        msgDiv.innerHTML = `<strong>${data.username}</strong>: <span>${data.message}</span> <div class="text-muted" style="font-size: 0.8em;">${data.timestamp}</div>`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>
{% endblock %}

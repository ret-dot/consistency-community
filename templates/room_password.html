{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 mt-10 flex justify-center">
  <div class="w-full max-w-sm bg-white dark:bg-darkCard shadow-lg rounded-xl p-8">
    <h3 class="text-2xl font-bold mb-6 text-center dark:text-gray-100">Enter Room Password</h3>
    <form method="post" class="space-y-4">
      <div>
        <input type="password"
          class="w-full px-4 py-2 border dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
          name="password" placeholder="Room Password" required autofocus>
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition font-semibold">Join
        Room</button>
    </form>
    {% if error %}
    <div class="mt-4 p-3 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded text-center text-sm">{{
      error }}</div>
    {% endif %}
    <div class="mt-6 text-center">
      <a href="{{ url_for('explore_rooms') }}" class="text-indigo-600 dark:text-indigo-400 hover:underline">Back to
        Rooms</a>
    </div>
  </div>
</div>
{% endblock %}

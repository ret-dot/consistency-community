{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-4 text-center">Enter Room Password</h3>
  <form method="post">
    <div class="mb-3">
      <input type="password" class="form-control" name="password" placeholder="Room Password" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100">Join Room</button>
  </form>
  {% if error %}
    <div class="alert alert-danger mt-3 text-center">{{ error }}</div>
  {% endif %}
  <div class="mt-3 text-center">
    <a href="{{ url_for('explore_rooms') }}">Back to Rooms</a>
  </div>
</div>
{% endblock %}
